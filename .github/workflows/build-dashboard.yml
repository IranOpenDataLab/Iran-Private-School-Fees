name: Build dashboard

# Standalone, opt-in dashboard publisher. Does NOT touch the scrape pipeline:
# the dataset is read-only input; no existing file is modified.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dashboard requirements
        run: pip install -r dashboard-requirements.txt

      - name: Build dashboard data
        run: python build_dashboard_data.py
        # fail-fast: missing column / lost school => non-zero exit, no deploy

      - name: Validate dataset untouched
        run: python validate_data.py

      - name: Sanity-check dashboard outputs
        run: |
          python - <<'EOF'
          import json
          d = 'public/data/'
          nat = json.load(open(d + 'national.json'))
          assert nat['n_schools'] == 24648, nat
          prov = json.load(open(d + 'by-province.json'))
          assert sum(r['n_schools'] for r in prov) == 24648
          g = json.load(open(d + 'graph/full.json'))
          assert g['meta']['n_schools'] == 24648 and len(g['schools']) == 24648
          assert len(g['districts']) == 558
          s = json.load(open(d + 'search-index.json'))
          assert len(s) == 24648
          ids = {x['school_id'] for x in
                 __import__('pandas').read_parquet('schools_data.parquet')[['school_id']].to_dict('records')}
          assert {x['id'] for x in s} == set(map(str, ids)), 'search/graph IDs diverge from dataset'
          assert {x[0] for x in g['schools']} == set(map(str, ids)), 'graph IDs diverge from dataset'
          print('dashboard sanity: 24648 schools in national/provinces/graph/search -- OK')
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
