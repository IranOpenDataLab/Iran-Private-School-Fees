name: Build dashboard

# Standalone, opt-in dashboard publisher. The dataset is read-only input;
# docs/ (the site) is regenerated, committed, and deployed via the official
# Pages artifact pipeline -- keep Settings > Pages source = GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: write

# A single manual run builds docs/, commits them, AND publishes to Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dashboard requirements
        run: pip install -r dashboard-requirements.txt

      - name: Build dashboard data
        run: python build_dashboard_data.py
        # fail-fast: missing column / lost school => non-zero exit, nothing committed

      - name: Validate dataset untouched
        run: python validate_data.py

      - name: Sanity-check dashboard outputs
        run: python scripts/check_dashboard.py

      - name: Commit regenerated docs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Dashboard already up to date"
          else
            git commit -m "chore: rebuild dashboard docs [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build-dashboard
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
